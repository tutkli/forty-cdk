pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,js,mjs,cjs}'
      run: pnpm exec eslint {staged_files}
    format:
      glob: '*.{ts,js,mjs,cjs,html,json,md,yml,yaml,css,scss}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.ts'
      run: pnpm typecheck:lib
    rule-fixtures:
      glob:
        - 'eslint.config.js'
        - 'scripts/check-rule-fixtures.mjs'
        - 'projects/forty-cdk/eslint-rules-fixtures/*'
      run: pnpm check:rule-fixtures
    lint-citations:
      glob:
        - 'eslint.config.js'
        - 'CLAUDE.md'
        - '.claude/rules/*.md'
        - '.github/**/*'
        - 'scripts/check-lint-citations.mjs'
        - 'projects/forty-cdk/eslint-rules-fixtures/*'
      run: pnpm check:lint-citations
