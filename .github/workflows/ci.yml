name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `build:docs` rather than `build:playground`: it is the same project in
      # its *production* configuration plus the prerender and its output check,
      # so it detects everything the development build does and, additionally,
      # the SSG failures that only appear when routes are rendered without a
      # browser. That path used to run nowhere but the Pages workflow, which
      # meant a prerender break surfaced as a red deploy on main instead of on
      # the PR that caused it — and since #1686 that deploy fires on every push.
      # Building the same project twice per PR would buy nothing beyond this.
      - run: pnpm build:docs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Sharded across 3 runners per browser engine. The single-job shape this
  # replaced could not pass: the suite needs ~19 min of wall clock at
  # `workers: 2` for both engines, against a `timeout-minutes: 15` — so the job
  # timed out even with every test green, and those timeouts were
  # indistinguishable from real failures. Each shard now runs ~4-6 min, which
  # leaves 2x headroom, and `retries: 0` (see playwright.config.ts) means a
  # race is reported instead of retried away.
  #
  # One engine per job so the browser cache holds exactly what the job needs;
  # the emulated mobile project riding the same engine joins it, since
  # `@mobile`-tagged tests are cheap and would otherwise need a job of their
  # own to download a second browser for.
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One shard's failure must not cancel the others: partial results across
      # engines are what tells a WebKit-only regression from a real one.
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3]
        include:
          - browser: chromium
            projects: --project=chromium --project='Mobile Chrome'
          - browser: webkit
            projects: --project=webkit --project='Mobile Safari'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed by engine: a job that installs only Chromium must not publish
          # its cache under a key a WebKit job would then restore and trust.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}/3
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore

  # Stitches every shard's blob into one HTML report, so a failure is read in a
  # single place rather than by opening six shard logs. Runs even when a shard
  # failed — that is precisely when the report is needed.
  e2e-report:
    name: E2E report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
