name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `build:docs` rather than `build:playground`: it is the same project in
      # its *production* configuration plus the prerender and its output check,
      # so it detects everything the development build does and, additionally,
      # the SSG failures that only appear when routes are rendered without a
      # browser. That path used to run nowhere but the Pages workflow, which
      # meant a prerender break surfaced as a red deploy on main instead of on
      # the PR that caused it — and since #1686 that deploy fires on every push.
      # Building the same project twice per PR would buy nothing beyond this.
      - run: pnpm build:docs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The docs pipeline's characterization suite (#1805). It rides the same
      # job because it is ~20s against `pnpm test`'s ~80s and shares the
      # runner's warm pnpm store; a job of its own would spend more time on
      # checkout and install than on tests.
      - run: pnpm test:docs

  # Sharded across 3 runners per browser engine. The single-job shape this
  # replaced could not pass: the suite needs ~19 min of wall clock at
  # `workers: 2` for both engines, against a `timeout-minutes: 15` — so the job
  # timed out even with every test green, and those timeouts were
  # indistinguishable from real failures. Each shard now runs ~4-6 min, which
  # leaves 2x headroom, and `retries: 0` (see playwright.config.ts) means a
  # race is reported instead of retried away.
  #
  # One engine per job so a WebKit-only regression is read off the shard names
  # rather than a merged log; the emulated mobile project riding the same engine
  # joins it, since `@mobile`-tagged tests are cheap and a job of their own
  # would buy nothing.
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # The official image ships both engines and every system library they need.
    # That is the whole point of it here: the `playwright install-deps` step it
    # replaces ran a full apt round on each of the six shards — the browser
    # cache holds binaries, never packages, so the cache-hit path paid for it
    # too — and a runner that drew a degraded Ubuntu mirror hung there until the
    # job timed out, reporting `cancelled` with every test `skipped`. Measured
    # inside one run: one shard fetched its 21 MB in 1s at 21.8 MB/s while
    # another crawled at ~7 kB/s past the 20 minute mark, and on another day
    # `azure.archive.ubuntu.com` answered `Ign:` to everything and even
    # `apt-get update` never returned from the fallback mirror.
    #
    # `--user 1001` is the uid the workspace is mounted with, so nothing the run
    # writes is left owned by root. `--ipc=host` is Playwright's own
    # recommendation for Chromium, which otherwise exhausts the container's
    # default 64 MB `/dev/shm` and crashes mid-suite.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    strategy:
      # One shard's failure must not cancel the others: partial results across
      # engines are what tells a WebKit-only regression from a real one.
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3]
        include:
          - browser: chromium
            projects: --project=chromium --project='Mobile Chrome'
          - browser: webkit
            projects: --project=webkit --project='Mobile Safari'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image tag and `@playwright/test` have to move together: the
      # container ships its builds under `/ms-playwright/<engine>-<revision>`,
      # and a package bumped without the tag looks for a revision that is not
      # there. Playwright's own error for that reads "please run playwright
      # install", which is the wrong repair inside a container and would send
      # the reader to reinstate the apt round this job exists to avoid — so the
      # mismatch fails here instead, before `ng serve` spends two minutes
      # building the harness, and names the tag as the thing to bump.
      - name: Verify the image ships this Playwright's browsers
        run: |
          expected=$(pnpm exec playwright install --dry-run ${{ matrix.browser }} | sed -n 's/^ *Install location: *//p' | head -1)
          if [ ! -d "$expected" ]; then
            echo "::error::@playwright/test $(node -p "require('@playwright/test/package.json').version") expects ${{ matrix.browser }} at $expected, which this container does not ship. Bump the image tag in this workflow to match the package."
            exit 1
          fi
          echo "$expected"
      - run: pnpm exec playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}/3
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore

  # Stitches every shard's blob into one HTML report, so a failure is read in a
  # single place rather than by opening six shard logs. Runs even when a shard
  # failed — that is precisely when the report is needed.
  e2e-report:
    name: E2E report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
